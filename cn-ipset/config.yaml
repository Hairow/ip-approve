# nali 地址库配置
# 由 watch 脚本以 NALI_HOME=/etc/cn-ipset 加载本文件；库文件与二进制同目录。
# download-urls 仅在执行 `nali update --db <name>` 时使用；仅 qqwry 指定 metowolf 源，
# ip2region / zxipv6wry 不写下载源（zx 走 nali 内置源，ip2region 不由 nali update 刷新）。
databases:
    - name: i2r-v4
      format: ip2region
      file: /etc/cn-ipset/ip2region_v4.xdb
      languages:
        - zh-CN
      types:
        - IPv4
    - name: qqwry
      format: qqwry
      file: /etc/cn-ipset/qqwry.dat
      languages:
        - zh-CN
      types:
        - IPv4
      download-urls:
        - "https://github.com/metowolf/qqwry.dat/releases/latest/download/qqwry.dat"
    - name: zxipv6wry
      format: zxipv6wry
      file: /etc/cn-ipset/zxipv6wry.db
      languages:
        - zh-CN
      types:
        - IPv6
selected:
    ipv4: qqwry
    ipv6: zxipv6wry
    lang: zh-CN
