# nali 地址库配置
# 由 watch 脚本以 NALI_HOME=/etc/cn-ipset 加载本文件；库文件与二进制同目录。
# download-urls 仅在执行 `nali update --db <name>` 时使用；未配置的 zxipv6wry 走 nali 内置源。
databases:
    - name: i2r-v4
      format: ip2region
      file: /etc/cn-ipset/ip2region_v4.xdb
      languages:
        - zh-CN
      types:
        - IPv4
      download-urls:
        - "https://cdn.jsdelivr.net/gh/lionsoul2014/ip2region@master/data/ip2region_v4.xdb"
        - "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb"
    - name: qqwry
      format: qqwry
      file: /etc/cn-ipset/qqwry.dat
      languages:
        - zh-CN
      types:
        - IPv4
      download-urls:
        - "https://github.com/metowolf/qqwry.dat/releases/latest/download/qqwry.dat"
    - name: zxipv6wry
      format: zxipv6wry
      file: /etc/cn-ipset/zxipv6wry.db
      languages:
        - zh-CN
      types:
        - IPv6
selected:
    ipv4: i2r-v4
    ipv6: zxipv6wry
    lang: zh-CN
